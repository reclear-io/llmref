name: Verify PR

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      registry_changed: ${{ steps.filter.outputs.registry }}
      snapshot_changed: ${{ steps.filter.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            registry:
              - 'registry/**'
            snapshot:
              - 'registry/*/**'

  verify-registry:
    needs: detect-changes
    if: needs.detect-changes.outputs.registry_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry layout and metadata
        run: python3 scripts/verify_registry.py

  verify-pr-title:
    needs: detect-changes
    if: needs.detect-changes.outputs.snapshot_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/verify_pr_title.py "$PR_TITLE"

  docs-only:
    needs: detect-changes
    if: needs.detect-changes.outputs.registry_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No registry changes — skipping snapshot validation."
