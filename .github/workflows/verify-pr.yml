name: Verify PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      registry_changed: ${{ steps.changes.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")

          echo "Changed files:"
          echo "$CHANGED"

          registry=false

          if echo "$CHANGED" | grep -q '^registry/'; then
            registry=true
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"

  verify-registry:
    needs: detect-changes
    if: needs.detect-changes.outputs.registry_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry layout and metadata
        run: python3 scripts/verify_registry.py

  verify-pr-title:
    needs: detect-changes
    if: needs.detect-changes.outputs.registry_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/verify_pr_title.py "$PR_TITLE"

  docs-only:
    needs: detect-changes
    if: needs.detect-changes.outputs.registry_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No registry changes — skipping snapshot validation."
