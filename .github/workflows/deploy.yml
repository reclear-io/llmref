name: Deploy to serving host

# When a snapshot merges to main, tell the serving host to hard-sync the merged
# registry and re-index (Qdrant + R2 dumps). The host holds a command-restricted
# SSH key that only runs the deploy hook, so this cannot run arbitrary commands.
on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-serving-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger host sync over SSH
        env:
          DEPLOY_KEY: ${{ secrets.SERVE_HOST_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.SERVE_HOST }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "SERVE_HOST_SSH_KEY secret is not set"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "SERVE_HOST secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The host key is command-restricted; this arg is ignored, the deploy hook runs.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 "root@${DEPLOY_HOST}" sync
