name: Ingest request

# When a maintainer approves a "Request docs" issue (adds the `approved` label),
# run the ingestion pipeline against the requested docs. The pipeline opens a
# snapshot PR against this repo; it goes live once that PR merges and the serving
# host reindexes. All actions are attributed to the llmref-bot GitHub App.
#
# Requires two secrets: LLMREF_BOT_APP_ID and LLMREF_BOT_PRIVATE_KEY (a GitHub App
# installed on reclear-io/llmref [Contents+PR write] and reclear-io/llmref-backend
# [Contents read]). Optional: FIRECRAWL_API_KEY for crawling non-native docs.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event.label.name == 'approved' &&
      contains(join(github.event.issue.labels.*.name, ','), 'request')
    runs-on: ubuntu-latest
    steps:
      - name: Mint bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LLMREF_BOT_APP_ID }}
          private-key: ${{ secrets.LLMREF_BOT_PRIVATE_KEY }}
          owner: reclear-io
          repositories: llmref,llmref-backend

      - name: Parse request
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          body = os.environ["ISSUE_BODY"]
          sections, cur, buf = {}, None, []
          for line in body.splitlines():
              m = re.match(r"^###\s+(.*)", line)
              if m:
                  if cur is not None:
                      sections[cur] = "\n".join(buf).strip()
                  cur, buf = m.group(1).strip(), []
              elif cur is not None:
                  buf.append(line)
          if cur is not None:
              sections[cur] = "\n".join(buf).strip()

          def get(label):
              v = sections.get(label, "").strip()
              return "" if v == "_No response_" else v

          print(f"project={get('Technology ID')}")
          print(f"version={get('Version')}")
          print(f"source_url={get('Docs root')}")
          PY

      - name: Validate fields
        run: |
          test -n "${{ steps.parse.outputs.project }}"    || { echo "::error::missing Technology ID"; exit 1; }
          test -n "${{ steps.parse.outputs.version }}"    || { echo "::error::missing Version"; exit 1; }
          test -n "${{ steps.parse.outputs.source_url }}" || { echo "::error::missing Docs root"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline
        run: pip install "git+https://x-access-token:${{ steps.bot.outputs.token }}@github.com/reclear-io/llmref-backend.git#subdirectory=pipeline"

      - name: Run ingestion
        id: run
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -o pipefail
          llm-txts-backend-pipeline \
            "${{ steps.parse.outputs.project }}" \
            "${{ steps.parse.outputs.version }}" \
            "${{ steps.parse.outputs.source_url }}" 2>&1 | tee run.log
          pr="$(grep -oE 'https://github.com/[^ ]+/pull/[0-9]+' run.log | head -1)"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Comment result on the issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const ok = '${{ steps.run.outcome }}' === 'success';
            const pr = '${{ steps.run.outputs.pr }}';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? (pr
                  ? `Snapshot PR opened: ${pr}\n\nIt goes live once the PR merges and the serving host reindexes.`
                  : `Ingestion ran. See the [workflow run](${run}) for the snapshot PR.`)
              : `Ingestion failed. See the [workflow run](${run}).`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
