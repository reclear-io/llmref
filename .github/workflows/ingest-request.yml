name: Approve documentation request

# Capture runs on the VPS. This action only acknowledges approval; the worker
# commits the request to its durable queue before reporting it as queued.
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: ingest-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  acknowledge:
    if: >-
      contains(github.event.issue.labels.*.name, 'approved') &&
      (contains(github.event.issue.labels.*.name, 'request') ||
       contains(github.event.issue.labels.*.name, 'registry'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- llmref-request-approval -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100
            });
            if (comments.some(c => c.user.type === 'Bot' && c.body.includes(marker))) return;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `${marker}\nApproved for processing by the documentation worker. It checks requests regularly and will link the snapshot PR here. Source or version questions may still need maintainer review. Publication is verified separately after merge.`
            });
