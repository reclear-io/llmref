name: Bulk ingest

# Discover native llms.txt sources and ingest a batch into the registry as one
# bot-authored PR. Everything runs as the llmref-bot GitHub App; nothing goes
# live until the PR is reviewed and merged (which triggers the serve-host sync).
#
# Requires secrets: LLMREF_BOT_APP_ID, LLMREF_BOT_PRIVATE_KEY (installed on
# reclear-io/llmref [Contents+PR write] and llmref-backend [Contents read]).
# Optional: FIRECRAWL_API_KEY (only used for non-native crawl fallbacks).

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Discovery sources (space-separated)"
        default: "llms-txt-hub seed"
      limit:
        description: "Max targets per source"
        default: "150"
      concurrency:
        description: "Concurrent pipeline runs"
        default: "6"

permissions:
  contents: read

concurrency:
  group: bulk-ingest
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mint bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LLMREF_BOT_APP_ID }}
          private-key: ${{ secrets.LLMREF_BOT_PRIVATE_KEY }}
          owner: reclear-io
          repositories: llmref,llmref-backend

      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline
        run: pip install "git+https://x-access-token:${{ steps.bot.outputs.token }}@github.com/reclear-io/llmref-backend.git#subdirectory=pipeline"

      - name: Discover targets
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
          SOURCES: ${{ inputs.sources }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=""
          for s in $SOURCES; do args="$args --source $s"; done
          llm-txts-backend-discover $args --limit "$LIMIT" --out targets.jsonl
          echo "discovered $(wc -l < targets.jsonl) targets"

      - name: Ingest into local registry checkout
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          # Non-blocking: unreachable sources are skipped; successes still land.
          llm-txts-backend-ingest targets.jsonl \
            --registry-path . \
            --concurrency "$CONCURRENCY" || true

      - name: Validate (informational; PR CI is the gate)
        run: python3 scripts/verify_registry.py || echo "::warning::validation issues; the PR's CI will gate them"

      - name: Open batch PR as the bot
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -e
          if git diff --quiet -- registry; then
            echo "No new snapshots to add."
            exit 0
          fi
          branch="bulk/${{ github.run_id }}"
          git config user.name "llmref-bot"
          git config user.email "llmref-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add registry
          added="$(git diff --cached --name-only -- 'registry/*/*/meta.json' | wc -l)"
          git commit -m "chore(registry): bulk add ${added} llms.txt snapshot(s)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(registry): bulk add ${added} llms.txt snapshot(s)" \
            --body "Automated batch from the bulk-ingest workflow (run ${{ github.run_id }}). Native llms.txt sources were discovered and ingested; reserved-license sources ship llms.txt + meta.json only. CI validates every snapshot before merge."
