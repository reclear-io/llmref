name: Report a documentation problem
description: Tell us about incorrect, broken or stale documentation
title: "Docs problem: "
labels: ["registry"]
body:
  - type: input
    id: affected
    attributes:
      label: Affected project or URL
      description: A project name, llmref link, or upstream documentation URL is enough.
      placeholder: Svelte, or https://example.org/docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Describe the problem. Specific examples or a corrected URL help, if you have them.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Include the version if the problem affects a particular release or snapshot.
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
