name: Report registry issue
description: Report incorrect, broken, or stale registry content
title: "Report [technology name] [version] - "
labels: ["registry"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report problems with existing registry artifacts:
        wrong content, broken links, stale snapshots, or metadata inconsistencies.

  - type: input
    id: technology_id
    attributes:
      label: Technology ID
      placeholder: svelte
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 5.0.0
    validations:
      required: true

  - type: input
    id: docs_root
    attributes:
      label: Docs root
      description: Official documentation URL for this snapshot
      placeholder: https://svelte.dev
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Broken or incorrect links in llms.txt
        - Incomplete or corrupted llms-full.txt
        - Stale content (upstream docs have changed)
        - meta.json inconsistency
        - Wrong docs root or version
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong? Include specific paths, lines, or URLs if possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the correct content or metadata be?
    validations:
      required: true

  - type: dropdown
    id: suggested_action
    attributes:
      label: Suggested action
      options:
        - Update (refresh snapshot)
        - Fix metadata only
        - Remove snapshot
        - Unsure
    validations:
      required: true
