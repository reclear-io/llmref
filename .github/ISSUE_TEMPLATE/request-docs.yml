name: Request docs
description: Ask maintainers to add or refresh a documentation snapshot
title: "Request [technology name] [version] - "
labels: ["request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to request a new snapshot or a refresh of an existing one.
        You do not need to prepare artifacts — maintainers will handle indexing.

        PR title format (if submitting yourself later): `Add|Update [technology name] [version name] - [reason phrase]`

  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      options:
        - Addition (new technology or version)
        - Update (refresh existing snapshot)
    validations:
      required: true

  - type: input
    id: technology_id
    attributes:
      label: Technology ID
      description: Registry slug, lowercase with hyphens. Example `svelte`, `nextjs`
      placeholder: svelte
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Exact upstream version string
      placeholder: 5.0.0
    validations:
      required: true

  - type: input
    id: docs_root
    attributes:
      label: Docs root
      description: Official public documentation URL
      placeholder: https://svelte.dev
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why should this be added or refreshed?
      placeholder: Community demand, new major release, upstream docs changed significantly
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: This is the official public documentation source
          required: true
        - label: No proprietary or non-public documentation is included
          required: true
        - label: I understand the license is detected automatically, and docs that do not permit redistribution are indexed for search but published without their full text
          required: false
