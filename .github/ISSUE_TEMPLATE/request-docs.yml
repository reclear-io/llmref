name: Request docs
description: Ask us to add or refresh documentation
title: "Docs request: "
labels: ["request"]
body:
  - type: markdown
    attributes:
      value: |
        Share the official documentation URL and what you need. We handle source verification, versioning, licensing and indexing.
  - type: input
    id: docs_url
    attributes:
      label: Documentation URL
      description: An official docs site, llms.txt, or public repository containing the docs.
      placeholder: https://example.org/docs
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What do you need?
      description: For example, add this project or refresh its outdated documentation.
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project or package name (optional)
      placeholder: Svelte
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Leave blank if you want the current documentation. A release or versioned docs link helps when requesting a specific version.
      placeholder: 5.0.0
